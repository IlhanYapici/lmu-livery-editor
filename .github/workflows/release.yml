# Releases (ADR-0030). release-please keeps a release pull request up to date from the commits on master.
# When that pull request is merged, it makes the tag vX.Y.Z and the GitHub release; then the Windows job
# builds the installer and uploads the files that electron-updater reads.
name: Release

on:
  push:
    branches: [master]

# One release run at a time; a new push waits for the old run (no cancel during an upload).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A personal access token: with GITHUB_TOKEN, the release pull request would start no CI run,
      # and the required check `windows` would block the merge.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  installer:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      # The tests already passed on this commit: the check `windows` is required on master.
      - name: Windows installer
        run: npm run dist:installer

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/LMU-Livery-Editor-Setup-*.exe dist/LMU-Livery-Editor-Setup-*.exe.blockmap dist/latest.yml --clobber
