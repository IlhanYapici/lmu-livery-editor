# CI on Windows only: the game and the app target Windows (ADR-0003, ADR-0028).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push cancels the run of an older push on the same branch (private repository: minutes count).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests (with coverage)
        run: npm run test:coverage

      - name: End-to-end tests
        run: npm run e2e

      - name: Windows installer
        run: npm run dist:installer

      - name: Dependency audit (report only)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Upload the Windows installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lmu-livery-editor-setup
          path: dist/LMU-Livery-Editor-Setup-*.exe
          retention-days: 7

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
